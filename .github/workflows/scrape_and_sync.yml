name: Kacky Scraper and Sync

permissions:
  contents: write

on:
  schedule:
    # Runs at 00:00 UTC every single day
    - cron: '0 12 * * *'
  workflow_dispatch:
    # Allows you to manually click a "Run workflow" button in GitHub

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out your code repository
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Python on the runner
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip' # Speeds up subsequent runs by caching dependencies

    # 3. Install your dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium supabase postgrest python-dotenv pandas

    # 4. Set up Firefox for Selenium
    - name: Setup Firefox
      uses: browser-actions/setup-firefox@v1
      with:
        firefox-version: latest

    # 5. Run the script with injected GitHub Secrets
    - name: Run Scraper Script
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      run: python main.py
    
    # 6. Update CSV for spreadsheet
    - name: Commit and Push CSV changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add rec_export.csv
        git diff-index --quiet HEAD || git commit -m "Automated update: Fresh scraper data"
        git push